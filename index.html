<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Web Page</title>
</head>
<body>

  <!-- Main Heading -->
  <h1>Welcome to My Web Page</h1>
  <p>This is a simple paragraph with <strong>bold text</strong> and <em>italicized text</em>.</p>

  <!-- Unordered List -->
  <h2>Key Features</h2>
  <ul>
    <li>Clean HTML5 structure</li>
    <li>Mobile-friendly viewport settings</li>
    <li>Semantic tags for readability</li>
  </ul>

  <!-- Link and Image -->
  <h2>Useful Resources</h2>
  <p>
    Learn more at the 
    <a href="https://mozilla.org" target="_blank">MDN Web Docs</a>.
  </p>
  <img src="https://placeholder.com" alt="Sample placeholder image">

  <!-- Simple Form -->
  <h2>Contact Form</h2>
  <form action="#" method="post">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>
    <button type="submit">Submit</button>
  </form>

</body>
</html>
